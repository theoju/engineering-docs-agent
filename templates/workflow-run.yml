# templates/workflow-run.yml — main authoring workflow
# Drop into the host repo at .github/workflows/docs-agent-run.yml
name: docs-agent run

on:
  schedule:
    - cron: "0 7 * * *"
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: docs-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    if: github.event_name == 'schedule' || (github.event.pull_request.merged == true && !startsWith(github.head_ref, 'docs-agent/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check out engineering-docs-agent plugin
        # CCE-57: the host repo is not the plugin. Vendor the plugin's
        # scripts/ directory into the runner workspace at .docs-agent-plugin
        # so the orchestrator step can invoke it. `ref: main` until the plugin
        # cuts a versioned release; pin a tag/SHA here when one exists.
        uses: actions/checkout@v5
        with:
          repository: theoju/engineering-docs-agent
          ref: main
          path: .docs-agent-plugin
      - name: Install plugin deps
        run: pip install pyyaml jsonschema
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run orchestrator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python .docs-agent-plugin/scripts/orchestrator_runner.py --repo-root .
