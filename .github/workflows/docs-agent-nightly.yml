name: docs-agent-nightly

on:
  # CCE-89 (2026-06-04): Cron unpaused after D1 + D2 shipped (PRs #112, #113).
  # The 2026-05-30 to 2026-06-01 stale-PR pileup was caused by docs-agent
  # PRs being unmergeable (sparse bodies) and never auto-closing when newer
  # nightlies superseded them. D1 (PR-body enrichment: review window + lens
  # counts + top-N pages + inline partial_reasons) makes nightly PRs
  # reviewable in <60s. D2 (auto-close-stale: "freshest-only" policy)
  # closes prior open docs-agent/* PRs unless human-edited. Together they
  # provide the cadence floor. D3 (merge-gate decision: auto-merge vs
  # operator-promote vs hybrid) is open as a separate ticket; until it
  # lands, the operator promotes each morning's PR manually after review.
  # If a stale-PR pileup recurs, re-pause this schedule (PR #108 is the
  # pause precedent) and file the regression on CCE-89.
  schedule:
    # Daily at 07:00 UTC — early enough for the team to see results
    # before workday start in PT/ET. Off-minute 7 follows the GitHub
    # Actions guidance to avoid the :00 schedule pileup.
    - cron: "7 7 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for manual fire (shown in run summary)"
        required: false
        default: "manual run"

permissions:
  contents: write # commit + push docs-agent/YYYY-MM-DD branch
  pull-requests: write # gh pr create + append-commit on existing PR
  issues: read # gap-detector reads linked issues (no writes)

concurrency:
  # One nightly authoring run at a time per branch. Manual fires queue
  # rather than parallelize so two runs don't race on the same
  # docs-agent/YYYY-MM-DD branch.
  group: docs-agent-nightly
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    # CCE-140: 60 -> 90. A cursor-backed truncated run now continues into the
    # merge epilogue, which is bounded by merge.checks_timeout_seconds (900s)
    # measured from the merge attempt rather than by the run's spent time
    # budget. Job total is setup (~6m) + authoring (35m, see
    # .engineering-docs-agent/config.yml) + the post-deadline tail (the
    # in-flight page batch, site generators, push, PR create; ~5m) + 15m of
    # check-polling = ~61m, which 60 cannot hold. A kill here lands BEFORE
    # run()'s notifier dispatch, so it would be a SILENT failure — the one
    # outcome worse than forfeiting the merge. Matches the ADIS host's 90.
    #
    # This is headroom, not a target: the binding ceiling is still the App
    # installation token's 1h TTL, minted after setup, which the config's
    # 2100s budget is sized against.
    #
    # CCE-152: the authoring term is the hard cap, not the budget — the
    # authoring loop may run to budget * 1.15 (2415s here) to finish the PR
    # group it is mid-way through. 2415 + 900 = 3315s leaves ~285s of the hour
    # for the tail, and `resolve_authoring_hard_cap` clamps the cap against the
    # TTL so this cannot silently stop holding.
    timeout-minutes: 90
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # CCE-53: surface Jira basic-auth credentials into the runner env so
      # source-collector's optional Jira enrichment path resolves linked
      # issue summaries instead of skipping with
      # source_collector_error: jira_auth_missing. See README "Jira
      # enrichment (optional)" for the same vars in the local-shell path.
      # secrets.* is valid at job-env scope (resolved at job start).
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
      # CCE-127: absorbed from templates/workflow-run.yml. Consumed by
      # agents/notifier.md when notifications.slack.enabled: true. Inert while
      # the secret is unset, but its absence meant this repo's nightly had no
      # channel to alert on at all — which is how the 2026-07-24 App-token
      # outage ran 15 nights unnoticed.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Generate GitHub App installation token
        # CCE-45: see GH_TOKEN comment above. The App
        # (engineering-docs-agent-bot, installed on this repo) carries
        # contents:write + pull-requests:write scopes matching the workflow's
        # permissions block. Token expires after 1h; the job timeout is 60min
        # so the token is always valid for the full run.
        #
        # CCE-127: "installed on this repo" is a live precondition, not a
        # setup-time fact. On 2026-07-23 this App was transferred from theoju
        # to an org during an unrelated migration, which DELETED its
        # installation here — credentials still perfect, scope gone. The mint
        # then 404s on /repos/{owner}/{repo}/installation (a 401 would mean bad
        # credentials; the 404 is what distinguishes them). This repo and
        # claude-code-self-assessment both failed 15 consecutive nightlies.
        id: app-token
        # Absorbed from templates/workflow-run.yml. Guards the same bare-host
        # path the template documents; also lets a var-unset misconfiguration
        # skip cleanly rather than fail.
        if: vars.DOCS_AGENT_APP_CLIENT_ID != ''
        # CCE-127: a failed token mint must not kill the job. continue-on-error
        # makes `conclusion` report success so the job proceeds, while `outcome`
        # retains the true `failure` — which is what we export below. Without
        # this, the step aborts the job and the `||` fallback on the next step
        # is never evaluated (GitHub only resolves it for a *skipped* step).
        continue-on-error: true
        # CCE-54: bumped v1 -> v3 for Node-24 runtime. v1 and v2 both ship on
        # Node 20, which GitHub deprecates June 2026; v3 is the first major on
        # Node 24.
        # CCE-66: v3 deprecates `app-id` in favor of `client-id` — a
        # semantically different App field (the OAuth Client ID, format
        # Iv1.xxx or Iv23li... depending on App age, not the numeric App ID).
        # Both inputs work in v3 today, but only `client-id` appears in
        # upstream examples. Stored as a repo Variable (not Secret) because
        # Client IDs are not credentials — they are visible on the App's
        # public settings page.
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOCS_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_AGENT_APP_PRIVATE_KEY }}

      - name: Checkout host repo
        id: checkout-host
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so state.json window math sees all merges
          # CCE-45: checkout configures git's credential helper from this
          # token, so the subsequent `git push` from the runner uses the
          # App token rather than the default GITHUB_TOKEN.
          #
          # CCE-127: the `||` resolves to GITHUB_TOKEN whenever the App-token
          # step produced no output — skipped via its `if:` OR failed under
          # continue-on-error. Without the fallback this line evaluated to an
          # empty token and checkout failed outright, turning a recoverable
          # degradation into a dead job.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        # Matches release.yml — the flat scripts/ layout isn't pip-installable.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema

      - name: Install claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          which claude || (echo "claude CLI not installed" && exit 1)

      - name: Assert OAuth token is configured and well-formed
        # Same actionable-failure pattern as release.yml.
        # CCE-49: three layered checks, cheapest first, each prints which failed:
        #   1. Non-empty (catches missing secret / wrong workflow-key wiring)
        #   2. sk-ant-oat prefix (catches sk-ant-api console keys or other paste errors)
        #   3. Length floor (catches truncation)
        # An expired OAuth token still passes regex/length and only fails at
        # dispatch time — that's CCE-49's "out of scope, separate ticket" territory.
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty or unset. Did you set the repo secret? See README \"Configuring secrets\"."
            exit 1
          fi
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            sk-ant-oat*) ;;
            sk-ant-api*) echo "::error::CLAUDE_CODE_OAUTH_TOKEN looks like a console API key (sk-ant-api...). The Claude CLI reads the OAuth slot (sk-ant-oat...). Run 'claude setup-token' and paste that value."; exit 1 ;;
            *) echo "::error::CLAUDE_CODE_OAUTH_TOKEN does not start with 'sk-ant-oat'. Got prefix: ${CLAUDE_CODE_OAUTH_TOKEN:0:10}... Run 'claude setup-token' to generate a valid OAuth token."; exit 1 ;;
          esac
          if [ ${#CLAUDE_CODE_OAUTH_TOKEN} -lt 32 ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is suspiciously short (${#CLAUDE_CODE_OAUTH_TOKEN} chars; real tokens are >100). Likely truncated paste. Re-copy from 'claude setup-token'."
            exit 1
          fi

      - name: Configure git identity
        # The runner does `git commit` itself; without an identity it errors
        # out before reaching the PR step.
        run: |
          git config user.name "engineering-docs-agent[bot]"
          git config user.email "engineering-docs-agent@users.noreply.github.com"

      - name: Run nightly authoring
        # CCE-127: `id` absorbed from the template so the parity tests can
        # locate the authoring step by one uniform predicate in both files.
        # Adding an id cannot change this step's parity signature —
        # _step_signature keys run-steps on the first line of `run:` and uses
        # `id` only for `uses:`-steps. The step NAME deliberately stays
        # host-specific.
        id: docs-agent
        # The runner reads .engineering-docs-agent/{config.yml,state.json},
        # computes the window vs HEAD, dispatches the pipeline, prepends
        # What's New, opens or append-commits to docs-agent/YYYY-MM-DD, and
        # writes state. Per spec §8: a partial run opens the PR anyway with
        # partial: true in the body — the workflow itself stays green so the
        # next nightly fire isn't suppressed by a red status.
        #
        # --repo-root is required by argparse; GITHUB_WORKSPACE is always set
        # by actions/checkout to the absolute path of the checked-out tree,
        # so no plumbing is needed beyond passing it through.
        #
        # DOCS_AGENT_DEBUG_DIR (SP-1/CCE-41): toggle the runner's
        # forensic capture mode (see scripts/orchestrator_runner.py).
        # Per-dispatch prompt/stdout/stderr/stream/meta land in this dir
        # and are persisted past the runner via the upload step below.
        env:
          DOCS_AGENT_DEBUG_DIR: ${{ runner.temp }}/docs-agent-debug
          # CCE-45: GH_TOKEN sourced from the GitHub App installation token
          # generated by the app-token step (not the default GITHUB_TOKEN).
          # The default GITHUB_TOKEN suppresses both pull_request and push
          # event triggers on commits/PRs it makes — a loop-prevention rule
          # that silently blocks the host repo's pytest/diagram-gate CI from
          # firing on docs-agent PRs. App-installation tokens are exempt from
          # that rule. Lives at step-env, not job-env, because GitHub's
          # runtime validator rejects `steps.*` references at job-env scope
          # (job-env is resolved before any step runs).
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # CCE-127: "failure" here makes the orchestrator record a blocking
          # app_token_unavailable reason, flipping the run to partial so
          # auto-merge is skipped — a GITHUB_TOKEN-built PR never fires host
          # CI, and zero registered checks would otherwise read as "nothing
          # failed". "skipped" (no App configured) and "success" are silent.
          # Must be `outcome`, not `conclusion`: continue-on-error rewrites
          # conclusion to success, which would report a healthy token mint for
          # a run that had none.
          DOCS_AGENT_APP_TOKEN_STATUS: ${{ steps.app-token.outcome }}
        run: python3 scripts/orchestrator_runner.py --repo-root "$GITHUB_WORKSPACE"

      - name: Upload subagent forensics
        # SP-1/CCE-41: persist the per-dispatch forensics the runner wrote
        # to DOCS_AGENT_DEBUG_DIR. `if: always()` runs the upload on success
        # AND failure — failures are the primary use case. `if-no-files-found:
        # warn` tolerates a runner step that fails before any dispatch happens
        # (config invalid, state corrupted) without breaking the workflow.
        # github.run_id is appended to the artifact name because v4 disallows
        # duplicate names within a single run.
        if: always()
        # CCE-54: bumped v4 -> v6 for Node-24 runtime. v4 and v5 both ship on
        # Node 20 (deprecated June 2026); v6 is the first major on Node 24.
        uses: actions/upload-artifact@v6
        with:
          name: docs-agent-subagent-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-agent-debug/
          retention-days: 14
          if-no-files-found: warn

      - name: Run summary
        if: always()
        # workflow_dispatch.inputs.reason is user-controlled; the github.com
        # workflow-injection guidance is to pass it via env: and dereference
        # as a shell var rather than interpolating into the script body.
        env:
          TRIGGER: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## docs-agent-nightly"
            echo ""
            echo "- **Run trigger:** \`$TRIGGER\`"
            if [ "$TRIGGER" = "workflow_dispatch" ]; then
              # Quote REASON so a value with spaces/newlines stays on one row.
              printf -- "- **Reason:** %s\n" "$REASON"
            fi
            echo "- **HEAD:** \`$(git rev-parse --short HEAD)\`"
            echo "- **State file (post-run):**"
            echo '  ```json'
            if [ -f .engineering-docs-agent/state.json ]; then
              # CCE-39 follow-up + state-deadcode (#bundle): explicit if-guard so the
              # "(no state)" fallthrough actually fires when the file is missing. The
              # earlier 'cat ... 2>/dev/null | sed ... || echo "..."' pattern masked
              # cat's nonzero exit because pipes hide upstream exit status. jq -e
              # also exits non-zero on invalid JSON, which is a useful signal.
              jq -e '.' .engineering-docs-agent/state.json 2>/dev/null | sed 's/^/  /' || echo "  (invalid or empty state)"
            else
              echo "  (no state)"
            fi
            echo '  ```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print partial-run reasons
        # CCE-73: echo the run's partial reasons to stdout so they show in
        # `gh run view --log` even when the run-summary block is collapsed.
        # CCE-144: read current_run.json, NOT state.json. save_persistent_state
        # strips _EPHEMERAL_KEYS = ("current_run",) before writing state.json,
        # so this step read a key that is never there and printed nothing on
        # every run since the ephemeral split — indistinguishable from a clean
        # run. Blind reasons print under their own label: they are the subset
        # that turns the run red.
        if: always()
        shell: bash
        run: |
          run_file=".engineering-docs-agent/current_run.json"
          if [ -f "$run_file" ]; then
            jq -r '.current_run.partial_reasons[]? // empty' "$run_file" || true
            jq -r '.current_run.blind_reasons[]? // empty | "BLIND: " + .' "$run_file" || true
          fi
