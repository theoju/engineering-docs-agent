site_name: engineering-docs-agent
docs_dir: docs/site-src
site_dir: site
repo_url: https://github.com/theoju/engineering-docs-agent
edit_uri: edit/main/docs/site-src/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md
  - gen-files:
      scripts:
        - gen_ref_pages.py
  - mkdocstrings:
      handlers:
        python:
          paths: ["scripts"]
          options:
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

nav:
  - Home: index.md
  - Architecture: architecture/
  - API reference: api/
  - Operations: operations/
  - Decision Archive: archive/
  - What's New: whats-new.md
