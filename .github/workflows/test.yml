name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Tests put scripts/ on sys.path themselves; install the runtime deps
        # directly rather than the package (flat multi-dir layout isn't pip-installable).
        # CCE-80: requirements-dev.txt adds ruamel.yaml for the parity test
        # (templates/workflow-run.yml ↔ .github/workflows/docs-agent-nightly.yml).
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
