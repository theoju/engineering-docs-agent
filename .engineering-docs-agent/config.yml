# CCE-140. Keeps this dogfood host inside its own job timeout now that a
# truncated run can earn a merge.
#
# `_maybe_auto_merge` used to be clamped to the run deadline, so the whole run
# finished within `time_budget_seconds`. CCE-140 exempts the merge epilogue
# from that budget when the advance is cursor-backed — a truncated run is past
# its deadline by construction, so enforcing it there would refuse every merge
# the change exists to perform. The epilogue is now bounded separately, by
# `merge.checks_timeout_seconds` (default 900s), measured from the merge
# attempt.
#
# At the 2700s default that is 2700 + 900 = 3600s — the whole of the App
# token's 1h TTL, with nothing left for the tail. (The job timeout is the
# slacker bound: `.github/workflows/docs-agent-nightly.yml` carries
# `timeout-minutes: 90` since CCE-140.) A cursor-backed truncated run that
# outlives the token degrades honestly, but a run that outlives the JOB is
# hard-killed mid-poll, BEFORE the notifier dispatch at the end of run(), so it
# fails silently: no digest, no partial reasons, no alarm. Strictly worse than
# forfeiting the merge, which at least reports that it forfeited.
#
# CCE-152: the authoring term is no longer this budget — the authoring loop may
# run to `run.authoring_hard_cap_seconds`, defaulting to budget * 1.15, to
# finish the PR group it is mid-way through. So the sum to size is the HARD CAP
# plus the poll: 2415 + 900 = 3315s, which leaves ~285s of the hour for the
# tail (the in-flight page batch, the site generators, the push, the PR create)
# — not the ten minutes the pre-CCE-152 arithmetic implied.
#
# Raising this back toward 2700 no longer merely eats that headroom: the TTL
# ceiling (3600 - 900 - 285 = 2415) would land at or below the budget, so the
# cap is squeezed flat onto it, every run records an advisory
# `authoring_hard_cap_squeezed` reason, and mid-group cuts come back. Lower
# `merge.checks_timeout_seconds` first if you want the budget back; the cap and
# the poll together are what have to clear the token.
run:
  time_budget_seconds: 2100

docs:
  framework: mkdocs
  # Publish-aligned (CCE-34): the agent authors into the SAME tree MkDocs
  # publishes (docs/site-src), so generated content deploys to Pages and the
  # publish-verifier's source_dir-stripping URL map resolves correctly.
  source_dir: docs/site-src
  whats_new_file: docs/site-src/whats-new.md
  agent_editable_paths:
    - "docs/site-src/**"
  lens_paths:
    core: docs/site-src/

sources:
  git:
    host: github
  jira:
    enabled: true
    base_url: https://designitright.atlassian.net
    project_keys:
      - CCE

voice:
  sample_paths:
    - CLAUDE.md
    - README.md

lint:
  tier1: default
  # CCE-131: tests/scripts must NOT be a package (CLAUDE.md invariant), so a
  # page documenting that rule necessarily names a file that cannot exist.
  citation_exempt_tokens:
    - tests/scripts/__init__.py

publishing:
  base_url: https://theoju.github.io/engineering-docs-agent/
  build_workflow: docs-pages.yml
  url_map_rule: standard
  verify_timeout_seconds: 60

notifications:
  slack:
    enabled: false
  email:
    enabled: false

# CCE-104: the information architecture the deterministic generators key off.
# generate_archive (capability D) reads the archive section's `sources`;
# generate_contracts reads an api-extract section's `json-schema` extractor
# (none yet — enabled in CCE-105). Without this block every generator no-ops.
site:
  docs_dir: docs/site-src
  theme: material
  sections:
    - key: home
      path: index.md
      title: Home
    - key: architecture
      path: architecture/
      title: Architecture
      generator: agent-authored
    - key: api
      path: api/
      title: API reference
      generator: api-extract
      extractors:
        - python-mkdocstrings
        - json-schema
      sources:
        - agents/schemas
      groups:
        - name: Orchestrator
          modules: [orchestrator_runner, state_io, contracts, stderr_emit]
        - name: Generators
          modules:
            [
              archive_indexes,
              contracts_doc,
              core_manifest,
              site_structure,
              source_map,
              source_drift,
              frontmatter_contract,
            ]
        - name: Lint
          modules: ["lint/*"]
        - name: Setup
          modules:
            [
              setup_discover,
              setup_scaffold,
              preflight_host,
              scaffold_workflow,
              enable_pages,
            ]
        - name: Verification
          modules: [verify_citations, verify_diagrams, verify_runner]
        - name: Integrations
          modules: [gh_client, jira_transition_on_merge, prune_merged_branches]
    - key: operations
      path: operations/
      title: Operations
    - key: archive
      path: archive/
      title: Decision Archive
      generator: archive-index
      sources:
        - docs/superpowers/specs
        - docs/superpowers/plans
        - docs/superpowers/measurements
    - key: whats-new
      path: whats-new.md
      title: What's New
      generator: changelog
