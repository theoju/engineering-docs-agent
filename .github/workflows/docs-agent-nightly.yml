name: docs-agent-nightly

on:
  schedule:
    # Daily at 07:00 UTC — early enough for the team to see results
    # before workday start in PT/ET. Off-minute 7 follows the GitHub
    # Actions guidance to avoid the :00 schedule pileup.
    - cron: "7 7 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for manual fire (shown in run summary)"
        required: false
        default: "manual run"

permissions:
  contents: write # commit + push docs-agent/YYYY-MM-DD branch
  pull-requests: write # gh pr create + append-commit on existing PR
  issues: read # gap-detector reads linked issues (no writes)

concurrency:
  # One nightly authoring run at a time per branch. Manual fires queue
  # rather than parallelize so two runs don't race on the same
  # docs-agent/YYYY-MM-DD branch.
  group: docs-agent-nightly
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # CCE-53: surface Jira basic-auth credentials into the runner env so
      # source-collector's optional Jira enrichment path resolves linked
      # issue summaries instead of skipping with
      # source_collector_error: jira_auth_missing. See README "Jira
      # enrichment (optional)" for the same vars in the local-shell path.
      # secrets.* is valid at job-env scope (resolved at job start).
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
    steps:
      - name: Generate GitHub App installation token
        # CCE-45: see GH_TOKEN comment above. The App (docs-agent-bot,
        # installed on this repo only) carries contents:write +
        # pull-requests:write scopes matching the workflow's permissions
        # block. Token expires after 1h; the job timeout is 60min so the
        # token is always valid for the full run.
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_AGENT_APP_ID }}
          private-key: ${{ secrets.DOCS_AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so state.json window math sees all merges
          # CCE-45: checkout configures git's credential helper from this
          # token, so the subsequent `git push` from the runner uses the
          # App token rather than the default GITHUB_TOKEN.
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        # Matches release.yml — the flat scripts/ layout isn't pip-installable.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema

      - name: Install claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          which claude || (echo "claude CLI not installed" && exit 1)

      - name: Assert OAuth token is configured
        # Same actionable-failure pattern as release.yml.
        run: '[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || (echo "CLAUDE_CODE_OAUTH_TOKEN secret not configured" && exit 1)'

      - name: Configure git identity
        # The runner does `git commit` itself; without an identity it errors
        # out before reaching the PR step.
        run: |
          git config user.name "engineering-docs-agent[bot]"
          git config user.email "engineering-docs-agent@users.noreply.github.com"

      - name: Run nightly authoring
        # The runner reads .engineering-docs-agent/{config.yml,state.json},
        # computes the window vs HEAD, dispatches the pipeline, prepends
        # What's New, opens or append-commits to docs-agent/YYYY-MM-DD, and
        # writes state. Per spec §8: a partial run opens the PR anyway with
        # partial: true in the body — the workflow itself stays green so the
        # next nightly fire isn't suppressed by a red status.
        #
        # --repo-root is required by argparse; GITHUB_WORKSPACE is always set
        # by actions/checkout to the absolute path of the checked-out tree,
        # so no plumbing is needed beyond passing it through.
        #
        # DOCS_AGENT_DEBUG_DIR (SP-1/CCE-41): toggle the runner's
        # forensic capture mode (see scripts/orchestrator_runner.py:357).
        # Per-dispatch prompt/stdout/stderr/stream/meta land in this dir
        # and are persisted past the runner via the upload step below.
        env:
          DOCS_AGENT_DEBUG_DIR: ${{ runner.temp }}/docs-agent-debug
          # CCE-45: GH_TOKEN sourced from the GitHub App installation token
          # generated by the app-token step (not the default GITHUB_TOKEN).
          # The default GITHUB_TOKEN suppresses both pull_request and push
          # event triggers on commits/PRs it makes — a loop-prevention rule
          # that silently blocks the host repo's pytest/diagram-gate CI from
          # firing on docs-agent PRs. App-installation tokens are exempt from
          # that rule. Lives at step-env, not job-env, because GitHub's
          # runtime validator rejects `steps.*` references at job-env scope
          # (job-env is resolved before any step runs).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/orchestrator_runner.py --repo-root "$GITHUB_WORKSPACE"

      - name: Upload subagent forensics
        # SP-1/CCE-41: persist the per-dispatch forensics the runner wrote
        # to DOCS_AGENT_DEBUG_DIR. `if: always()` runs the upload on success
        # AND failure — failures are the primary use case. `if-no-files-found:
        # warn` tolerates a runner step that fails before any dispatch happens
        # (config invalid, state corrupted) without breaking the workflow.
        # github.run_id is appended to the artifact name because v4 disallows
        # duplicate names within a single run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-agent-subagent-forensics-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-agent-debug/
          retention-days: 14
          if-no-files-found: warn

      - name: Run summary
        if: always()
        # workflow_dispatch.inputs.reason is user-controlled; the github.com
        # workflow-injection guidance is to pass it via env: and dereference
        # as a shell var rather than interpolating into the script body.
        env:
          TRIGGER: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## docs-agent-nightly"
            echo ""
            echo "- **Run trigger:** \`$TRIGGER\`"
            if [ "$TRIGGER" = "workflow_dispatch" ]; then
              # Quote REASON so a value with spaces/newlines stays on one row.
              printf -- "- **Reason:** %s\n" "$REASON"
            fi
            echo "- **HEAD:** \`$(git rev-parse --short HEAD)\`"
            echo "- **State file (post-run):**"
            echo '  ```json'
            if [ -f .engineering-docs-agent/state.json ]; then
              # CCE-39 follow-up + state-deadcode (#bundle): explicit if-guard so the
              # "(no state)" fallthrough actually fires when the file is missing. The
              # earlier 'cat ... 2>/dev/null | sed ... || echo "..."' pattern masked
              # cat's nonzero exit because pipes hide upstream exit status. jq -e
              # also exits non-zero on invalid JSON, which is a useful signal.
              jq -e '.' .engineering-docs-agent/state.json 2>/dev/null | sed 's/^/  /' || echo "  (invalid or empty state)"
            else
              echo "  (no state)"
            fi
            echo '  ```'
          } >> "$GITHUB_STEP_SUMMARY"
