docs:
  framework: mkdocs
  # Publish-aligned (CCE-34): the agent authors into the SAME tree MkDocs
  # publishes (docs/site-src), so generated content deploys to Pages and the
  # publish-verifier's source_dir-stripping URL map resolves correctly.
  source_dir: docs/site-src
  whats_new_file: docs/site-src/whats-new.md
  agent_editable_paths:
    - "docs/site-src/**"
  lens_paths:
    core: docs/site-src/

sources:
  git:
    host: github
  jira:
    enabled: true
    base_url: https://designitright.atlassian.net
    project_keys:
      - CCE

voice:
  sample_paths:
    - CLAUDE.md
    - README.md

lint:
  tier1: default

publishing:
  base_url: https://theoju.github.io/engineering-docs-agent/
  build_workflow: docs-pages.yml
  url_map_rule: standard
  verify_timeout_seconds: 60

notifications:
  slack:
    enabled: false
  email:
    enabled: false

# CCE-104: the information architecture the deterministic generators key off.
# generate_archive (capability D) reads the archive section's `sources`;
# generate_contracts reads an api-extract section's `json-schema` extractor
# (none yet — enabled in CCE-105). Without this block every generator no-ops.
site:
  docs_dir: docs/site-src
  theme: material
  sections:
    - key: home
      path: index.md
      title: Home
    - key: architecture
      path: architecture/
      title: Architecture
      generator: agent-authored
    - key: api
      path: api/
      title: API reference
      generator: api-extract
      extractors:
        - python-mkdocstrings
    - key: operations
      path: operations/
      title: Operations
    - key: archive
      path: archive/
      title: Decision Archive
      generator: archive-index
      sources:
        - docs/superpowers/specs
        - docs/superpowers/plans
        - docs/superpowers/measurements
    - key: whats-new
      path: whats-new.md
      title: What's New
      generator: changelog
