name: release

on:
  push:
    tags:
      - "v*"

jobs:
  live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `claude setup-token` mints an OAuth token (sk-ant-oat…) tied to a
      # Claude subscription; the CLI reads it from CLAUDE_CODE_OAUTH_TOKEN,
      # NOT ANTHROPIC_API_KEY (which is for console sk-ant-api… keys).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Flat multi-dir layout isn't pip-installable; tests put scripts/ on
        # sys.path themselves. Install runtime + test deps directly (matches test.yml).
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Install claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code || true
          which claude || (echo "claude CLI not installed" && exit 1)
      - name: Assert OAuth token is configured and well-formed
        # In CI, env-var auth is the only auth path (no interactive keychain
        # OAuth). dispatch_subagent inherits the full env (orchestrator_runner.py),
        # so CLAUDE_CODE_OAUTH_TOKEN propagates to the claude subprocess. Fail
        # with an actionable message if the secret is missing, rather than
        # letting the live tests fail opaquely on a None dispatch response.
        # CCE-49: three layered checks, cheapest first, each prints which failed:
        #   1. Non-empty (catches missing secret / wrong workflow-key wiring)
        #   2. sk-ant-oat prefix (catches sk-ant-api console keys or other paste errors)
        #   3. Length floor (catches truncation)
        # An expired OAuth token still passes regex/length and only fails at
        # dispatch time — that's CCE-49's "out of scope, separate ticket" territory.
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty or unset. Did you set the repo secret? See README \"Configuring secrets\"."
            exit 1
          fi
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            sk-ant-oat*) ;;
            sk-ant-api*) echo "::error::CLAUDE_CODE_OAUTH_TOKEN looks like a console API key (sk-ant-api...). The Claude CLI reads the OAuth slot (sk-ant-oat...). Run 'claude setup-token' and paste that value."; exit 1 ;;
            *) echo "::error::CLAUDE_CODE_OAUTH_TOKEN does not start with 'sk-ant-oat'. Got prefix: ${CLAUDE_CODE_OAUTH_TOKEN:0:10}... Run 'claude setup-token' to generate a valid OAuth token."; exit 1 ;;
          esac
          if [ ${#CLAUDE_CODE_OAUTH_TOKEN} -lt 32 ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is suspiciously short (${#CLAUDE_CODE_OAUTH_TOKEN} chars; real tokens are >100). Likely truncated paste. Re-copy from 'claude setup-token'."
            exit 1
          fi
      - name: Run live tests
        run: pytest -m live -v
